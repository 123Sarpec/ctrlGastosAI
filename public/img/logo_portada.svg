  <polygon points="146,72 158,78 152,60" fill="#2563EB"></polygon>

  <!-- Billetera -->

  <rect x="32" y="42" width="90" height="55" rx="12" fill="#2563EB"></rect>

  <rect x="85" y="57" width="42" height="24" rx="10" fill="#ffffff"></rect>

  <circle cx="105" cy="69" r="4" fill="#2563EB"></circle>

