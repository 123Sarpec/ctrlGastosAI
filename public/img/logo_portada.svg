  <line x1="150" y1="185" x2="178" y2="185" stroke="#16A34A" stroke-width="4"></line>

  <circle cx="182" cy="170" r="4" fill="#16A34A"></circle>
  <circle cx="182" cy="185" r="4" fill="#16A34A"></circle>

  <!-- Texto -->

  <text x="230" y="95" font-size="88" font-family="Poppins, Arial, sans-serif" font-weight="700" fill="url(#textGrad)">
      wblest
  </text>

  <text x="230" y="145" font-size="24" font-family="Poppins, Arial, sans-serif" fill="#374151">
