      <stop offset="100%" stop-color="#16A34A"></stop>
    </linearGradient>
  </defs>

  <!-- Icono -->

  <circle cx="105" cy="105" r="88" fill="none" stroke="url(#grad)" stroke-width="8"></circle>

  <!-- Barras -->

  <rect x="55" y="140" width="18" height="35" rx="3" fill="#16A34A"></rect>
  <rect x="82" y="120" width="18" height="55" rx="3" fill="#16A34A"></rect>
  <rect x="109" y="95" width="18" height="80" rx="3" fill="#16A34A"></rect>
  <rect x="136" y="65" width="18" height="110" rx="3" fill="#16A34A"></rect>

  <!-- Flecha -->

